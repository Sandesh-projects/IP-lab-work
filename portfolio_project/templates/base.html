<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}Portfolio{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <!-- Snippet from base.html -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark" style="background-color: black;">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Sandesh</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('portfolio') }}">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
                    </li>
                    <!-- New "Requests" nav item -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('list_requests') }}">Requests</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Content Block -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5">
        <div class="container">
            <p>&copy; 2025 Sandesh Portfolio. All Rights Reserved.</p>
            <div class="social-icons">
                <a href="https://github.com/Sandesh-projects" target="_blank" class="me-3">
                    <i class="fab fa-github fa-2x"></i>
                </a>
                <a href="https://www.instagram.com/sandesh.willback/" target="_blank" class="me-3">
                    <i class="fab fa-instagram fa-2x"></i>
                </a>
                <a href="https://www.linkedin.com/in/sandesh-mukesh-yadav-2a5863241/" target="_blank">
                    <i class="fab fa-linkedin fa-2x"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
